<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" role="img" aria-label="FieldFlow Systems logo">

  <!-- Orange pentagon icon -->
  <polygon
    points="50,8 92,30 92,72 50,94 8,72 8,30"
    fill="#E8620A"
    stroke="#C4500A"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Letter F (left) - white rects inside pentagon -->
  <!-- Vertical stem -->
  <rect x="24" y="28" width="8" height="44" fill="#FFFFFF" rx="1"/>
  <!-- Top horizontal bar -->
  <rect x="24" y="28" width="22" height="8" fill="#FFFFFF" rx="1"/>
  <!-- Middle horizontal bar -->
  <rect x="24" y="47" width="17" height="7" fill="#FFFFFF" rx="1"/>

  <!-- Letter F (right) - white rects inside pentagon -->
  <!-- Vertical stem -->
  <rect x="52" y="28" width="8" height="44" fill="#FFFFFF" rx="1"/>
  <!-- Top horizontal bar -->
  <rect x="52" y="28" width="22" height="8" fill="#FFFFFF" rx="1"/>
  <!-- Middle horizontal bar -->
  <rect x="52" y="47" width="17" height="7" fill="#FFFFFF" rx="1"/>

  <!-- Node dots on middle crossbars (navy) -->
  <circle cx="46" cy="50" r="3.5" fill="#0f1e36"/>
  <circle cx="74" cy="50" r="3.5" fill="#0f1e36"/>

  <!-- Wordmark -->
  <text x="112" y="58" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="42" font-weight="700" dominant-baseline="middle">FieldFlow</text>
  <text x="114" y="80" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" letter-spacing="4" dominant-baseline="middle">SYSTEMS</text>

</svg>
