name: FieldFlow Automation

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply_legal_pages:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/apply legal-pages'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run legal pages generator
        run: node scripts/apply-legal-pages.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add legal pages and footer links"
          title: "Add legal pages and footer links"
          body: "Automated changes: added privacy policy, terms & disclaimer, data retention pages; ensured footer links across site."
          branch: "automation/legal-pages"
          delete-branch: true
          base: "main"
