name: FieldFlow Automation

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply_legal_pages:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/apply legal-pages'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create script (if missing) and run it
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scripts

          if [ ! -f "scripts/apply-legal-pages.js" ]; then
            cat > scripts/apply-legal-pages.js <<'EOF'
            const fs = require("fs");
            const path = require("path");

            const TEMPLATE = "contact.html";

            const footerLinksHTML = [
              '<a href="/privacy-policy.html">Privacy Policy</a>',
              '<a href="/terms-disclaimer.html">Terms &amp; Disclaimer</a>',
              '<a href="/data-retention.html">Data Retention</a>',
            ].join(" | ");

            function replaceTitle(html, newTitle) {
              if (!/<title>[\s\S]*?<\/title>/i.test(html)) {
                throw new Error("No <title> found.");
              }
              return html.replace(/<title>[\s\S]*?<\/title>/i, `<title>${newTitle}</title>`);
            }

            function replaceMainInner(html, newInner) {
              const m = html.match(/<main\b[^>]*>([\s\S]*?)<\/main>/i);
              if (!m) throw new Error("No <main>...</main> found in template.");
              const mainOpen = html.match(/<main\b[^>]*>/i)[0];
              return html.replace(/<main\b[^>]*>[\s\S]*?<\/main>/i, `${mainOpen}\n${newInner}\n</main>`);
            }

            function ensureFooterLinks(html) {
              // already present?
              if (
                html.includes("/privacy-policy.html") &&
                html.includes("/terms-disclaimer.html") &&
                html.includes("/data-retention.html")
              ) {
                return html;
              }

              // try to inject into footer if present
              const footerMatch = html.match(/<footer\b[^>]*>[\s\S]*?<\/footer>/i);
              if (footerMatch) {
                const footerBlock = footerMatch[0];
                const injected = footerBlock.replace(
                  /<\/footer>/i,
                  `\n  <div class="legal-links" style="margin-top:12px;font-size:0.95em;">${footerLinksHTML}</div>\n</footer>`
                );
                return html.replace(footerBlock, injected);
              }

              // otherwise inject before </body>
              if (/<\/body>/i.test(html)) {
                return html.replace(
                  /<\/body>/i,
                  `\n<div class="legal-links" style="text-align:center;margin:24px 0;font-size:0.95em;">${footerLinksHTML}</div>\n</body>`
                );
              }

              // last resort: append
              return html + `\n<div class="legal-links">${footerLinksHTML}</div>\n`;
            }

            function writePageFromTemplate(templateHtml, filename, title, bodyHtml) {
              let out = templateHtml;
              out = replaceTitle(out, title);
              out = replaceMainInner(out, bodyHtml);
              out = ensureFooterLinks(out);
              fs.writeFileSync(filename, out, "utf8");
            }

            function listTopLevelHtmlFiles() {
              const entries = fs.readdirSync(process.cwd(), { withFileTypes: true });
              return entries
                .filter((e) => e.isFile() && e.name.toLowerCase().endsWith(".html"))
                .map((e) => e.name);
            }

            function main() {
              if (!fs.existsSync(TEMPLATE)) {
                throw new Error(`Template file "${TEMPLATE}" not found at repo root.`);
              }

              const templateHtml = fs.readFileSync(TEMPLATE, "utf8");

              const privacyBody = `
              <h1>Privacy Policy</h1>
              <p><strong>Effective date:</strong> ${new Date().toLocaleDateString("en-CA", { year: "numeric", month: "long", day: "numeric" })}</p>
              <p>FieldFlow Systems respects your privacy and is committed to protecting personal information you share with us.</p>

              <h2>Information We Collect</h2>
              <ul>
                <li>Information you submit via forms (name, email, company, role, message)</li>
                <li>Basic technical data (IP address, browser type) may be collected by hosting/analytics tools</li>
              </ul>

              <h2>How We Use Information</h2>
              <ul>
                <li>Respond to inquiries and demo requests</li>
                <li>Improve our website and services</li>
                <li>Operate internal workflows related to service delivery</li>
              </ul>

              <h2>Sharing</h2>
              <p>We do not sell personal information. Information may be processed by trusted service providers strictly for operational purposes and under confidentiality.</p>

              <h2>Data Retention</h2>
              <p>See our <a href="/data-retention.html">Data Retention</a> page for details.</p>

              <h2>Contact</h2>
              <p>Email: <a href="mailto:hello@fieldflowsystems.ca">hello@fieldflowsystems.ca</a></p>
              `.trim();

              const termsBody = `
              <h1>Terms &amp; Disclaimer</h1>
              <p>FieldFlow Systems provides digital workflow, documentation, and operational support tools intended to assist organizations in structuring internal processes.</p>

              <h2>General Disclaimer</h2>
              <p>We do not provide legal, regulatory, or compliance certification services. Use of our tools and materials does not replace professional advice.</p>

              <h2>User Responsibility</h2>
              <p>You are responsible for ensuring that your operations, processes, and safety systems meet applicable legal and regulatory requirements.</p>

              <h2>Availability</h2>
              <p>Services may be modified or discontinued at any time. We aim for reliability, but do not guarantee uninterrupted availability.</p>

              <h2>Limitation of Liability</h2>
              <p>To the fullest extent permitted by law, FieldFlow Systems is not liable for any direct or indirect damages arising from the use or inability to use our services.</p>
              `.trim();

              const retentionBody = `
              <h1>Data Retention Policy</h1>
              <p>FieldFlow Systems maintains a disciplined and minimal data retention approach aligned with operational necessity and privacy responsibility.</p>

              <h2>What We Retain</h2>
              <ul>
                <li>Demo request submissions (name, email, company, role, interest)</li>
                <li>Operational or workflow data only when explicitly provided during pilots or engagements</li>
              </ul>

              <h2>Retention Period</h2>
              <ul>
                <li>Inquiry and demo data: retained for up to 12 months</li>
                <li>Client or pilot operational data: retained as defined by engagement scope or agreement</li>
              </ul>

              <h2>Access Controls</h2>
              <p>Access to retained data is limited to authorized FieldFlow Systems operators only.</p>

              <h2>Deletion</h2>
              <p>Data is deleted or anonymized once it is no longer required for operational, engagement, or legal purposes.</p>
              `.trim();

              writePageFromTemplate(templateHtml, "privacy-policy.html", "Privacy Policy | FieldFlow Systems", privacyBody);
              writePageFromTemplate(templateHtml, "terms-disclaimer.html", "Terms & Disclaimer | FieldFlow Systems", termsBody);
              writePageFromTemplate(templateHtml, "data-retention.html", "Data Retention | FieldFlow Systems", retentionBody);

              // Ensure footer links exist across all top-level html files (including the template itself)
              for (const f of listTopLevelHtmlFiles()) {
                let html = fs.readFileSync(f, "utf8");
                const updated = ensureFooterLinks(html);
                if (updated !== html) {
                  fs.writeFileSync(f, updated, "utf8");
                }
              }

              console.log("Legal pages created and footer links applied.");
            }

            main();
            EOF
          fi

          node scripts/apply-legal-pages.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add legal pages and footer links"
          title: "Add legal pages and footer links"
          body: "Automated change: adds privacy policy, terms & disclaimer, data retention pages, and footer links sitewide."
          branch: "automation/legal-pages"
          base: "main"
